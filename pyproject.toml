[tool.uv.workspace]
members = [
    "packages/mcqpy-core",
    "packages/mcqpy-pdf",
    "packages/mcqpy-shiny",
]

[project]
name = "mcqpy"
version = "0.3.0"
description = "Umbrella CLI package for MCQPy"
readme = "README.md"
authors = [
    { name = "Mads-Peter", email = "machri@phys.au.dk" }
]
requires-python = ">=3.13"
dependencies = [
    "click>=8.3.0",
    "mcqpy-core>=0.1.0",
    "mcqpy-pdf>=0.1.0",
    "rich>=14.2.0",
    "rich-click>=1.9.3",
]

[tool.uv.sources]
mcqpy-core = { workspace = true }
mcqpy-pdf = { workspace = true }

[project.scripts]
mcqpy = "mcqpy.cli.main:main"

[build-system]
requires = ["uv_build>=0.8.18,<0.9.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 88


[tool.pytest.ini_options]
testpaths = ["pytest/"]
addopts = [
  "--cov-report", "term",
  "--cov-report", "html:.coverage-html",
  "--cov-report", "xml:.coverage.xml",
  "--junitxml", ".report.xml",
  "--cov", "src/mcqpy",
  "--cov", "src/mcqpy_core",
  "--cov", "src/mcqpy_pdf",
  "--cov", "src/mcqpy_shiny",
]

[tool.coverage.run]
omit = []

[dependency-groups]
dev = [
    "ruff>=0.14.10",
    "pytest>=9.0.1",
    "pytest-cov>=7.0.0",
    "pytest-mock>=3.15.1",
    "shiny>=1.2.1",
    "shinylive>=0.8.5",
    "zensical>=0.0.27",
    "mkdocstrings-python>=1.15.0",
    "mkdocs-gen-files>=0.5.0",
    "mkdocs-autoapi>=0.4.0",
    "mkdocs-pdf>=0.1.2",
    "mkdocs-click>=0.9.0",
]
