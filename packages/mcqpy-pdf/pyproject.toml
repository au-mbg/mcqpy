[project]
name = "mcqpy-pdf"
version = "0.1.0"
description = "PDF compilation, parsing, and report rendering for MCQPy"
readme = "README.md"
authors = [
    { name = "Mads-Peter", email = "machri@phys.au.dk" }
]
requires-python = ">=3.13"
dependencies = [
    "mcqpy-core>=0.1.0",
    "click>=8.3.0",
    "openpyxl>=3.1.5",
    "pylatex>=1.4.2",
    "pylatexenc>=2.10",
    "pypdf>=6.1.1",
    "rich>=14.2.0",
    "rich-click>=1.9.3",
]

[tool.uv.sources]
mcqpy-core = { workspace = true }

[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "../../src"}

[tool.setuptools.packages.find]
where = ["../../src"]
include = ["mcqpy_pdf", "mcqpy_pdf.*"]
