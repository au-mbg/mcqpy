[project]
name = "mcqpy-shiny"
version = "0.1.0"
description = "Static-friendly Shiny quiz app for mcqpy bundles"
readme = "README.md"
authors = [
    { name = "Mads-Peter", email = "machri@phys.au.dk" }
]
requires-python = ">=3.13,<3.14"
dependencies = [
    "mcqpy-core>=0.1.0",
    "shiny>=1.2.1",
]

[tool.uv.sources]
mcqpy-core = { workspace = true }

[project.scripts]
mcqpy-shiny = "mcqpy_shiny.app:run_app"
mcqpy-shiny-embed = "mcqpy_shiny.embed_cli:main"

[dependency-groups]
dev = [
    "pytest>=8.4.1",
    "shinylive>=0.8.5",
]

[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "../../src"}

[tool.setuptools.packages.find]
where = ["../../src"]
include = ["mcqpy_shiny", "mcqpy_shiny.*"]
