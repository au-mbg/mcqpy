[project]
name = "mcqpy-core"
version = "0.1.0"
description = "Core question, manifest, grading, analysis, and browser-safe runtime logic for MCQPy"
readme = "README.md"
authors = [
    { name = "Mads-Peter", email = "machri@phys.au.dk" }
]
requires-python = ">=3.13"
dependencies = [
    "click>=8.3.0",
    "matplotlib>=3.10.7",
    "numpy>=2.3.3",
    "pandas>=2.3.3",
    "pillow>=11.3.0",
    "pydantic>=2.12.0",
    "pyyaml>=6.0.3",
    "requests>=2.28.0",
    "rich>=14.2.0",
    "rich-click>=1.9.3",
    "scipy>=1.17.0",
]

[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "../../src"}

[tool.setuptools.packages.find]
where = ["../../src"]
include = ["mcqpy_core", "mcqpy_core.*"]
