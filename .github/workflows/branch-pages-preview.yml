name: Branch Pages Preview

on:
  push:
    branches:
      - monorepo_refactor
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  pages-build:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/monorepo_refactor'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python 3.13
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Build workspace wheels
        run: |
          uv build --package mcqpy
          uv build --package mcqpy-core
          uv build --package mcqpy-pdf
          uv build --package mcqpy-shiny

      - name: Build documentation
        env:
          TERM: dumb
        run: uv run zensical build --config-file docs/zensical.toml

      - name: Copy wheels into docs site
        run: uv run python docs/scripts/build_docs_wheels.py

      - name: Render Quarto Shiny site
        run: quarto render docs/shiny-pages

      - name: Assemble Pages artifact
        run: |
          mkdir -p docs/site/shiny
          rm -rf docs/site/shiny/*
          cp -R docs/shiny-pages/_site/. docs/site/shiny/

      - name: Upload to GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs/site

  pages-deploy:
    runs-on: ubuntu-latest
    needs: pages-build
    if: github.ref == 'refs/heads/monorepo_refactor'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
